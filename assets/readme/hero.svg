<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">块茎幸存者 Tuber Survivors — 3D 俯视角波次生存竞技场</title>
  <desc id="desc">深空霓虹底标题：块茎幸存者，副标题六英雄，九武器，扛过二十波；右侧是竞技场俯视图，环刃围绕土豆战士旋转，霓虹敌人从四周涌来。</desc>

  <rect width="1200" height="360" rx="26" fill="#050810"/>

  <g id="neon-grid" stroke="#0e2a3d" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360 M600 0 V360 M660 0 V360 M720 0 V360 M780 0 V360 M840 0 V360 M900 0 V360 M960 0 V360 M1020 0 V360 M1080 0 V360 M1140 0 V360"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#4de8ff">3D 波次生存竞技场 · 3D SURVIVORS ARENA</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f5f7fa">块茎幸存者</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">TUBER SURVIVORS — 六英雄，九武器，扛过二十波</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">深空霓虹竞技场，武器全自动，晶体既是经验也是钱。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="108" height="36" rx="18" fill="#0b1526" stroke="#1d3a52" stroke-width="1.5"/><text x="110" y="262">6 英雄</text></g>
      <g><rect x="176" y="238" width="108" height="36" rx="18" fill="#0b1526" stroke="#1d3a52" stroke-width="1.5"/><text x="230" y="262">9 武器</text></g>
      <g><rect x="296" y="238" width="150" height="36" rx="18" fill="#0b1526" stroke="#1d3a52" stroke-width="1.5"/><text x="371" y="262">20 波次</text></g>
      <g><rect x="458" y="238" width="150" height="36" rx="18" fill="#0b1526" stroke="#1d3a52" stroke-width="1.5"/><text x="533" y="262">2 只 Boss</text></g>
    </g>
  </g>

  <g id="arena-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="820" y="40" font-size="18" fill="#4de8ff">第 1 波 · 环刃护体，怪潮合围</text>
    <g id="arena">
      <circle cx="960" cy="200" r="118" fill="#071018" stroke="#12395a" stroke-width="2"/>
      <circle cx="960" cy="200" r="88" fill="none" stroke="#12395a" stroke-width="1"/>
      <circle cx="960" cy="200" r="56" fill="none" stroke="#12395a" stroke-width="1"/>
      <g id="enemies">
        <circle cx="960" cy="102" r="12" fill="#ff5d7a"/>
        <circle cx="1043" cy="133" r="10" fill="#9b59d0"/>
        <circle cx="1066" cy="200" r="12" fill="#ff5d7a"/>
        <circle cx="1043" cy="267" r="11" fill="#ffb04d"/>
        <circle cx="960" cy="298" r="12" fill="#ff5d7a"/>
        <circle cx="877" cy="267" r="11" fill="#59d98c"/>
        <circle cx="854" cy="200" r="12" fill="#ff5d7a"/>
        <circle cx="877" cy="133" r="10" fill="#ffe14d"/>
        <circle cx="1010" cy="160" r="15" fill="#9b59d0"/>
      </g>
      <g id="orbit" stroke="#6bffb0" stroke-width="2" fill="none">
        <circle cx="960" cy="200" r="34" stroke-dasharray="3 5" opacity="0.7"/>
      </g>
      <g id="blades" fill="#6bffb0">
        <polygon points="960,160 968,174 960,170 952,174"/>
        <polygon points="994,214 986,222 984,212 992,208"/>
        <polygon points="926,214 934,222 936,212 928,208"/>
      </g>
      <g id="player" transform="translate(960 200)">
        <ellipse cx="0" cy="14" rx="16" ry="6" fill="#000000" opacity="0.4"/>
        <rect x="-10" y="-16" width="20" height="30" rx="10" fill="#d8b58a" stroke="#a67c4e" stroke-width="2"/>
        <circle cx="-4" cy="-4" r="2.5" fill="#1a1a2e"/>
        <circle cx="5" cy="-4" r="2.5" fill="#1a1a2e"/>
        <circle cx="0" cy="6" r="17" fill="none" stroke="#4de8ff" stroke-width="2" opacity="0.5"/>
      </g>
      <g id="sparks" fill="#ffd257">
        <circle cx="1024" cy="148" r="3"/>
        <circle cx="1036" cy="168" r="2.5"/>
        <circle cx="1018" cy="182" r="2"/>
        <circle cx="1048" cy="190" r="3"/>
      </g>
    </g>
    <g id="tier-gems" font-size="17" text-anchor="middle">
      <g><rect x="800" y="322" width="14" height="14" rx="3" fill="#c9d6e4"/><text x="822" y="335" fill="#e8ecf4" text-anchor="start">普通</text></g>
      <g><rect x="882" y="322" width="14" height="14" rx="3" fill="#6bffb0"/><text x="904" y="335" fill="#e8ecf4" text-anchor="start">精良</text></g>
      <g><rect x="964" y="322" width="14" height="14" rx="3" fill="#b06bff"/><text x="986" y="335" fill="#e8ecf4" text-anchor="start">史诗</text></g>
      <g><rect x="1046" y="322" width="14" height="14" rx="3" fill="#ffd257"/><text x="1068" y="335" fill="#e8ecf4" text-anchor="start">传说</text></g>
    </g>
  </g>
</svg>
